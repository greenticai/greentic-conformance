name: Conformance (Hosted, no tunnel)

on:
  workflow_dispatch:
    inputs:
      rp_base:
        description: 'Public RP base URL (https)'
        required: true
      plan_id:
        description: 'Hosted plan identifier (from the web UI)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y jq curl; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "apt-get failed after 3 attempts" >&2; exit 1; fi
            echo "apt-get attempt $attempt failed or timed out; retrying in 15s" >&2
            sleep 15
          done
      - name: Hosted Conformance
        env:
          CS_URL: https://www.certification.openid.net
          CS_TOKEN: ${{ secrets.CS_TOKEN }}
          PLAN_ID: ${{ github.event.inputs.plan_id }}
          ALIAS: greentic-rp
          CLIENT_REG: dynamic_client
          REQUEST_TYPE: plain_http_request
          CONFIG_JSON: ci/plans/examples/rp-code-pkce-basic.config.json
          USE_TUNNEL: "0"
          RP_BASE: ${{ github.event.inputs.rp_base }}
        run: |
          bash ci/scripts/run_conformance_hosted_with_tunnel.sh
