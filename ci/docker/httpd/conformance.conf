Listen 443

<VirtualHost *:443>
    ServerName conformance.local
    SSLEngine on
    SSLCertificateFile      /usr/local/apache2/conf/server.crt
    SSLCertificateKeyFile   /usr/local/apache2/conf/server.key

    # Trust suite container output as-is — preserves Host for OIDF dynamic
    # client redirects. The suite resolves issuer URLs against the public
    # SUITE_BASE, so the proxy must not rewrite Host.
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /health http://server:8080/api/runner/available
    ProxyPassReverse /health http://server:8080/api/runner/available

    ProxyPass        / http://server:8080/
    ProxyPassReverse / http://server:8080/
</VirtualHost>
